name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon
            triple: aarch64-apple-darwin
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - run: cargo build --release --locked --target ${{ matrix.triple }}
      - name: Package
        shell: bash
        run: |
          set -eu
          bin=herdr-mobile-bridge
          src="target/${{ matrix.triple }}/release/$bin"
          tar -czf "$bin-${{ matrix.triple }}.tar.gz" -C "$(dirname "$src")" "$bin"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.triple }}
          path: herdr-mobile-bridge-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # One checksum file for every asset, generated centrally so parallel
      # build jobs cannot clobber each other's SHA256SUMS.
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
