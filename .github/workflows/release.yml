name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon
            triple: aarch64-apple-darwin
          - os: macos-13          # Intel
            triple: x86_64-apple-darwin
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - run: cargo build --release --locked --target ${{ matrix.triple }}
      - name: Package
        shell: bash
        run: |
          set -eu
          bin=herdr-mobile-bridge
          src="target/${{ matrix.triple }}/release/$bin"
          out="$bin-${{ matrix.triple }}.tar.gz"
          tar -czf "$out" -C "$(dirname "$src")" "$bin"
          if command -v sha256sum >/dev/null; then
            sha256sum "$out" >> SHA256SUMS
          else
            shasum -a 256 "$out" >> SHA256SUMS
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.triple }}
          path: |
            herdr-mobile-bridge-*.tar.gz
            SHA256SUMS

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
